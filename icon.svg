<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c1a"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="inset" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer book shadow/border -->
  <rect x="72" y="110" width="368" height="292" rx="18" fill="#2a2622" filter="url(#shadow)"/>

  <!-- Left page -->
  <rect x="80" y="118" width="172" height="276" rx="14" fill="#f5f0e8"/>
  <!-- Left page lines -->
  <circle cx="112" cy="185" r="5" fill="#c8c2b8"/>
  <rect x="126" y="181" width="100" height="8" rx="4" fill="#d8d2c8"/>
  <circle cx="112" cy="218" r="5" fill="#c8c2b8"/>
  <rect x="126" y="214" width="85" height="8" rx="4" fill="#d8d2c8"/>
  <circle cx="112" cy="251" r="5" fill="#c8c2b8"/>
  <rect x="126" y="247" width="95" height="8" rx="4" fill="#d8d2c8"/>
  <circle cx="112" cy="284" r="5" fill="#c8c2b8"/>
  <rect x="126" y="280" width="75" height="8" rx="4" fill="#d8d2c8"/>
  <circle cx="112" cy="317" r="5" fill="#c8c2b8"/>
  <rect x="126" y="313" width="90" height="8" rx="4" fill="#d8d2c8"/>

  <!-- Right page -->
  <rect x="260" y="118" width="172" height="276" rx="14" fill="#ede8df"/>

  <!-- Spine / binding -->
  <rect x="242" y="118" width="28" height="276" rx="6" fill="#2a2622"/>
  <!-- Binding rings -->
  <ellipse cx="256" cy="186" rx="10" ry="7" fill="#c9a84c"/>
  <ellipse cx="256" cy="236" rx="10" ry="7" fill="#c9a84c"/>
  <ellipse cx="256" cy="286" rx="10" ry="7" fill="#c9a84c"/>
  <ellipse cx="256" cy="336" rx="10" ry="7" fill="#c9a84c"/>

  <!-- Gold coin on right page -->
  <circle cx="340" cy="195" r="38" fill="#c9a84c"/>
  <circle cx="340" cy="195" r="30" fill="#e8c96a"/>
  <circle cx="340" cy="195" r="22" fill="#c9a84c"/>

  <!-- Trending chart line on right page -->
  <polyline
    points="284,340 308,310 332,318 358,278 388,248"
    fill="none"
    stroke="#c9a84c"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polygon points="388,248 368,244 378,264" fill="#c9a84c"/>
</svg>
