<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep warm black background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111010"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <!-- Gold shimmer on text -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a87c2a"/>
    </linearGradient>
    <!-- Subtle gold glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle top-left corner glow -->
  <circle cx="90" cy="80" r="140" fill="#c9a84c" opacity="0.04"/>

  <!-- Book / notebook shape — the دفتر concept -->
  <!-- Back cover -->
  <rect x="138" y="130" width="236" height="290" rx="14" fill="#1c1a18" stroke="#3a3020" stroke-width="1.5"/>
  <!-- Spine shadow line -->
  <rect x="138" y="130" width="22" height="290" rx="0" fill="#111010" opacity="0.7"/>
  <rect x="152" y="130" width="4" height="290" fill="#c9a84c" opacity="0.15"/>

  <!-- Front cover with gold edge -->
  <rect x="148" y="118" width="228" height="282" rx="12" fill="#1a1814"/>
  <rect x="148" y="118" width="228" height="282" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Gold corner accent top-right -->
  <path d="M330 118 L376 118 L376 162" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Horizontal ruled lines — notebook feel -->
  <line x1="175" y1="195" x2="348" y2="195" stroke="#c9a84c" stroke-width="0.8" opacity="0.18"/>
  <line x1="175" y1="218" x2="348" y2="218" stroke="#c9a84c" stroke-width="0.8" opacity="0.12"/>
  <line x1="175" y1="241" x2="348" y2="241" stroke="#c9a84c" stroke-width="0.8" opacity="0.12"/>
  <line x1="175" y1="264" x2="348" y2="264" stroke="#c9a84c" stroke-width="0.8" opacity="0.12"/>
  <line x1="175" y1="287" x2="320" y2="287" stroke="#c9a84c" stroke-width="0.8" opacity="0.10"/>

  <!-- Red bookmark ribbon -->
  <rect x="330" y="118" width="16" height="72" rx="2" fill="#c0392b" opacity="0.85"/>
  <polygon points="330,190 346,190 338,208" fill="#c0392b" opacity="0.85"/>

  <!-- Arabic دفتر — centered, gold, prominent -->
  <text
    x="262" y="172"
    text-anchor="middle"
    font-family="'Geeza Pro', 'Arial Unicode MS', 'Noto Naskh Arabic', serif"
    font-size="52"
    font-weight="700"
    fill="url(#gold)"
    filter="url(#softglow)"
    letter-spacing="2">دفتر</text>

  <!-- Latin "DAFTAR" — small, tracked, below Arabic -->
  <text
    x="262" y="320"
    text-anchor="middle"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#c9a84c"
    letter-spacing="8"
    opacity="0.9">DAFTAR</text>

  <!-- Thin gold separator between Arabic and Latin -->
  <line x1="196" y1="338" x2="328" y2="338" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- Tagline — ultra small, bottom -->
  <text
    x="262" y="360"
    text-anchor="middle"
    font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-size="14"
    font-weight="400"
    fill="#c9a84c"
    letter-spacing="3"
    opacity="0.45">PERSONAL TRACKER</text>

  <!-- Bottom spine dots — binding detail -->
  <circle cx="162" cy="200" r="2.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="162" cy="230" r="2.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="162" cy="260" r="2.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="162" cy="290" r="2.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="162" cy="320" r="2.5" fill="#c9a84c" opacity="0.3"/>
  <circle cx="162" cy="350" r="2.5" fill="#c9a84c" opacity="0.3"/>
</svg>
